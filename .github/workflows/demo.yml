name: demo

on:
    workflow_call:
        inputs:
            version:
                description: Version of @alfalab/core-components package, tag, ref or sha
                required: true
                type: string
            directory:
                description: Directory to deploy demo
                required: false
                type: string
            deploy-repository:
                description: Repository
                required: false
                type: string
            pull-request-number:
                description: Pull request number
                type: string
                required: false
        outputs:
            run-id:
                description: Artifact workflow run id
                value: ${{ jobs.build-demo.outputs.run-id }}
    workflow_dispatch:
        inputs:
            version:
                description: Version of @alfalab/core-components package, tag or sha
                required: false
                type: string
            directory:
                description: Directory to deploy demo
                required: false
                type: string

concurrency:
    group: ${{ format('{0}-{1}', github.workflow, case(inputs.version == '', github.ref, inputs.version)) }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    params:
        uses: core-ds/core-components/.github/workflows/resolve-demo-params.yml@master
        with:
            version: ${{ case(github.event_name == 'workflow_dispatch' && inputs.version == '', github.ref, inputs.version) }}
            directory: ${{ inputs.directory }}

    variants:
        needs: params
        uses: core-ds/core-components/.github/workflows/variants.yml@master
        with:
            ref: ${{ needs.params.outputs.ref }}

    build-demo:
        needs: [params, variants]
        strategy:
            matrix:
                include: ${{ fromJson(needs.variants.outputs.config) }}
        uses: core-ds/core-components/.github/workflows/build-demo.yml@master
        secrets: inherit
        with:
            ref: ${{ needs.params.outputs.ref }}
            variant: ${{ matrix.variant }}
            artifact-name: ${{ matrix.variant }}

    deploy:
        if: ${{ github.repository == 'core-ds/core-components' && vars.APP_ID != '' }}
        needs: [build-demo, params, variants]
        strategy:
            matrix:
                include: ${{ fromJson(needs.variants.outputs.config) }}
        runs-on: ubuntu-latest
        steps:
            - name: Generate app token
              id: generate-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Dispatch deploy demo workflow
              uses: actions/github-script@v9
              id: dispatch
              with:
                  github-token: ${{ steps.generate-token.outputs.token }}
                  result-encoding: string
                  script: |
                      const { data } = await github.rest.actions.createWorkflowDispatch({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          workflow_id: 'dispatch-deploy-demo.yml',
                          ref: 'master',
                          inputs: {
                              'run-id': '${{ needs.build-demo.outputs.run-id }}',
                              'directory': '${{ case(matrix.variant == 'default', needs.params.outputs.directory, format('{0}-{1}', needs.params.outputs.directory, matrix.variant)) }}',
                              'variant': '${{ matrix.variant }}',
                              'artifact-name': '${{ matrix.variant }}',
                              'deploy-repository': '${{ inputs.deploy-repository }}',
                              'pull-request-number': '${{ inputs.pull-request-number }}',
                          }
                      });

                      return data.workflow_run_id;

            - name: Clean up workflow run on cancel
              if: cancelled()
              uses: actions/github-script@v9
              with:
                  github-token: ${{ steps.generate-token.outputs.token }}
                  script: |
                      await github.rest.actions.cancelWorkflowRun({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: Number('${{ steps.dispatch.outputs.result }}'),
                      });
